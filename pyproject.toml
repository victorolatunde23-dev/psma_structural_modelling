[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psma-pipeline"
version = "0.1.0"
description = "Structural-bioinformatics pipeline for PSMA / GCPII (UniProt Q04609): PDB survey, modelling assessment, MD preparation and analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.2",
  "scipy>=1.10",
  "requests>=2.28",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "gemmi>=0.6.4",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "scikit-learn>=1.3",
  "networkx>=3.0",
  "pytest>=7.0",
]

[project.optional-dependencies]
structure = ["biopython>=1.81", "freesasa>=2.2"]
chem = ["rdkit>=2023.3"]
alphafold = ["tmtools>=0.2"]
prep = ["openmm>=8.0", "propka>=3.5", "pdb2pqr>=3.6"]
md = ["MDAnalysis>=2.6"]
io = ["pyarrow>=12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (opt-in: PSMA_NETWORK_TESTS=1)"]
