# Classification of PDB chemical components (comp_id, upper case).
#
# Every non-polymer component is assigned to exactly one class, checked in
# this order:
#   1. ion of interest
#   2. glycan
#   3. additive / buffer
#   4. ligand of interest   (everything else)
# Edit these lists to change the classification; the choice is recorded in
# the reproducibility manifest.

ions_of_interest: [ZN, CA, CL]

# Glycan building blocks (PSMA is heavily N-glycosylated).
glycans: [NAG, NDG, MAN, BMA, FUC, FUL, GAL, GLA, SIA, GLC, BGC, XYS, A2G, NGA]

# Crystallisation / cryoprotectant / buffer components and common counter-ions.
# Reported, but kept apart from ligands of interest. Mg2+ and Na+ are treated
# as additives by default.
additives: [HOH, DOD, GOL, EDO, PEG, PGE, PG4, 1PE, P6G, 2PE, 12P, 15P, PE4, PE8,
            MPD, MRD, DMS, ACT, ACY, FMT, SO4, PO4, NO3, SCN, IOD, BR, NA, K, MG,
            NH4, TRS, MES, EPE, IMD, BTB, CIT, FLC, TAR, MLI, IPA, EOH, BU3, PGO,
            PGR, UNX, UNL]

# Components treated as metal ions for contact cut-offs and coordination
# analysis (they use the metal cut-off even when classified as additives).
metals: [ZN, CA, MG, NA, K, MN, FE, CU, NI, CO, CD]

# Anions using the anion cut-off.
anions: [CL]
