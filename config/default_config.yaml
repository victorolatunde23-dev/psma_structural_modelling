# Default configuration for the PSMA structural-modelling pipeline.
#
# Every value here is recorded in the reproducibility manifest of each run.
# Override any key by passing a second YAML file or a dict to
# psma_pipeline.config.load_config(overrides=...).

target:
  accession: Q04609                 # UniProt accession of the target
  name: PSMA / GCPII / FOLH1
  # Target-specific definition files (paths relative to this config folder).
  # For another protein, copy and edit these files and point to them here.
  active_site_file: psma_active_site.yaml
  regions_file: psma_regions.yaml
  ligand_classes_file: ligand_classes.yaml

run:
  limit: null                       # process only the first N entries (null = all)
  use_coordinates: true             # download mmCIF and analyse with gemmi
  random_seed: 20261021             # used by every stochastic step
  ids: null                         # explicit list of PDB IDs (overrides search)

paths:                              # relative to the project root unless absolute
  cache: cache
  outputs: outputs
  data: data

outputs:
  survey_workbook: "{accession}_structures.xlsx"
  assessment_workbook: "{accession}_modelling_assessment.xlsx"
  pocket_workbook: "{accession}_pockets_waters_variants.xlsx"
  alphafold_workbook: "{accession}_alphafold_membrane.xlsx"   # Milestone 4 + membrane context
  preparation_workbook: "{accession}_model_preparation.xlsx"  # Milestone 5
  md_workbook: "{accession}_md_setup.xlsx"                    # Milestone 6
  write_csv: true
  write_parquet: true               # skipped with a warning if pyarrow is missing
  manifest: "{accession}_manifest.json"

http:
  retries: 5
  backoff_factor: 1.0
  timeout_s: 120
  polite_delay_s: 0.15              # pause after each uncached request
  user_agent: psma-structural-modelling/0.1 (python-requests)
  refresh_404_after_days: 30        # re-fetch cached "not found" responses after this

endpoints:
  rcsb_search: https://search.rcsb.org/rcsbsearch/v2/query
  rcsb_graphql: https://data.rcsb.org/graphql
  rcsb_cif: https://files.rcsb.org/download/{pdb}.cif.gz
  pdbe_sifts: https://www.ebi.ac.uk/pdbe/api/mappings/uniprot/{pdb}
  pdbe_best: https://www.ebi.ac.uk/pdbe/api/mappings/best_structures/{acc}
  pdbe_val_percentiles: https://www.ebi.ac.uk/pdbe/api/validation/global-percentiles/entry/{pdb}
  pdbe_val_outliers: https://www.ebi.ac.uk/pdbe/api/validation/residuewise_outlier_summary/entry/{pdb}
  uniprot_json: https://rest.uniprot.org/uniprotkb/{acc}?format=json
  validation_xml: https://files.rcsb.org/pub/pdb/validation_reports/{mid}/{pdb}/{pdb}_validation.xml.gz
  validation_xml_fallback: https://www.ebi.ac.uk/pdbe/entry-files/download/{pdb}_validation.xml
  emdb_entry: https://www.ebi.ac.uk/emdb/api/entry/{emdb}
  rcsb_chem_comp: https://data.rcsb.org/graphql
  ebi_variation: https://www.ebi.ac.uk/proteins/api/variation/{acc}
  afdb_prediction: https://alphafold.ebi.ac.uk/api/prediction/{acc}   # Milestone 4

structure:
  # first = model 1 only (default). all = every model of NMR ensembles
  # (accepted; currently falls back to model 1 with a recorded warning - there
  # are no NMR entries for Q04609, so this is deferred, see docs/CHECKLIST.md).
  model_policy: first
  # Order in which assemblies are preferred; the first match wins.
  assembly_preference: [author, software, first]

contacts:                           # Å
  metal: 2.8                        # first coordination shell
  anion: 3.6                        # chloride
  ligand: 4.0                       # organic ligand – protein contacts
  glycan_link: 2.0                  # sugar C1 – Asn ND2 covalent link
  neighbour_search_radius: 6.0
  backbone_atoms: [N, CA, C, O, OXT]

variability:
  min_common_ca: 50                 # minimum common CA atoms to superpose two chains

ranking:
  # Each mode declares filters, criteria (direction lower|higher, weight) and a
  # missing-value policy (ignore = average over the criteria an entry has;
  # worst = a missing value counts as the worst rank). Filters:
  #   {column: value} | {column: [values]} | {column: {min: x, max: y}}
  #   {column: {contains: "text"}} | {column: {empty: true|false}}
  # "global" reproduces the original ranking exactly. Columns marked (M2) are
  # produced by notebook 02 (modelling assessment).
  modes:
    global:
      description: Global homology-modelling template (original ranking)
      include: {}
      exclude: {}
      criteria:
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
        - {column: "Ramachandran outliers (%)", direction: lower,  weight: 1}
        - {column: "Fewest internal missing",   direction: lower,  weight: 1}
        - {column: "Best UniProt coverage",     direction: higher, weight: 1}
        - {column: "Active-site completeness",  direction: higher, weight: 1}
      missing: ignore
    active_site:
      description: Active-site modelling template (wild-type active site, well supported)
      include: {}
      exclude: {"Active-site residues differing from UniProt": {empty: false}}
      criteria:
        - {column: "Active-site completeness",        direction: higher, weight: 2}
        - {column: "Active-site local support score", direction: higher, weight: 2}   # (M2)
        - {column: "Active-site mean normalised B",   direction: lower,  weight: 1}
        - {column: "Zn site complete",                direction: higher, weight: 1}   # (M2)
        - {column: "Resolution (Å)",                  direction: lower,  weight: 1}
        - {column: "Clashscore",                      direction: lower,  weight: 1}
      missing: worst
    ligand_bound:
      description: Ligand-bound template (ligand-conditioned ranking follows in Milestone 3)
      include: {"Ligands of interest": {empty: false}}
      exclude: {}
      criteria:
        - {column: "Ligand local support score",      direction: higher, weight: 2}   # (M2)
        - {column: "Max ligand B ratio",              direction: lower,  weight: 1}
        - {column: "Active-site completeness",        direction: higher, weight: 1}
        - {column: "Resolution (Å)",                  direction: lower,  weight: 1}
        - {column: "Clashscore",                      direction: lower,  weight: 1}
      missing: worst
    apo:
      description: Apo-state template (no ligand of interest)
      include: {"Ligands of interest": {empty: true}}
      exclude: {}
      criteria:
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
        - {column: "Fewest internal missing",   direction: lower,  weight: 1}
        - {column: "Active-site completeness",  direction: higher, weight: 1}
      missing: ignore
    open_lid:
      description: Open entrance-lid template
      include: {"Entrance lid state": "open"}
      exclude: {}
      criteria:
        - {column: "Entrance-lid local support score", direction: higher, weight: 2}   # (M2)
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
        - {column: "Active-site completeness",  direction: higher, weight: 1}
      missing: worst
    closed_lid:
      description: Closed entrance-lid template
      include: {"Entrance lid state": "closed"}
      exclude: {}
      criteria:
        - {column: "Entrance-lid local support score", direction: higher, weight: 2}   # (M2)
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
        - {column: "Active-site completeness",  direction: higher, weight: 1}
      missing: worst
    dimer_interface:
      description: Dimer-interface template (canonical, complete, well supported interface)
      include: {"Monomer / dimer": "dimer"}
      exclude: {"Noncanonical interface flag": true}
      criteria:
        - {column: "Canonical interface similarity", direction: higher, weight: 2}   # (M2)
        - {column: "Interface complete",             direction: higher, weight: 2}   # (M2)
        - {column: "Interface local support score",  direction: higher, weight: 1}   # (M2)
        - {column: "Resolution (Å)",                 direction: lower,  weight: 1}
        - {column: "Clashscore",                     direction: lower,  weight: 1}
      missing: worst
    md_start:
      description: MD starting structure (wild type, complete, no antibody chains)
      include: {"Monomer / dimer": "dimer"}
      exclude: {"N substitutions vs UniProt": {min: 1}, "Has other polymer chains": true}
      criteria:
        - {column: "Fewest internal missing",   direction: lower,  weight: 2}
        - {column: "Best UniProt coverage",     direction: higher, weight: 1}
        - {column: "Active-site completeness",  direction: higher, weight: 1}
        - {column: "Interface complete",        direction: higher, weight: 1}   # (M2)
        - {column: "Zn site complete",          direction: higher, weight: 1}   # (M2)
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
      missing: worst
    glycosylated:
      description: Glycosylated structural template (most observed N-glycan sites)
      include: {}
      exclude: {}
      criteria:
        - {column: "Glycosylated Asn count",    direction: higher, weight: 2}   # (M2)
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
      missing: worst
    cryoem_reference:
      description: Cryo-EM / reference-comparison template
      include: {"Method": {contains: "ELECTRON"}}
      exclude: {}
      criteria:
        - {column: "EM Q-score",                direction: higher, weight: 2}   # (M2)
        - {column: "Resolution (Å)",            direction: lower,  weight: 1}
        - {column: "Clashscore",                direction: lower,  weight: 1}
      missing: worst

interfaces:
  contact_cutoff: 4.0           # Å, heavy-atom contact defining interface residues
  hbond_max: 3.5                # Å, N/O donor–acceptor (distance-only; no angles)
  salt_bridge_max: 4.0          # Å, acidic O – basic N
  salt_bridge_include_his: false
  hydrophobic_max: 4.5          # Å, C–C between hydrophobic side chains
  aromatic_centroid_max: 6.5    # Å, ring-centroid distance (Phe/Tyr/Trp[/His])
  neighbourhood: 8.0            # Å, glycans / ligands / ions reported "near" the interface
  sasa:
    method: auto                # auto (FreeSASA if installed, else shrake_rupley) | freesasa | shrake_rupley
    probe: 1.4                  # Å
    n_points: 100               # Shrake–Rupley points per atom
  altloc: first                 # keep the first alternate location of each atom
  canonical:
    min_fraction: 0.5           # residue/contact present in >= this fraction of author-defined dimer interfaces
    noncanonical_jaccard: 0.3   # below this Jaccard to the canonical set -> noncanonical
    min_bsa_fraction: 0.5       # BSA below this fraction of the canonical median -> flagged
  clustering:
    method: average             # scipy hierarchical linkage
    distance_threshold: 0.5     # 1 - Jaccard
  lattice:
    enabled: true               # search crystal contacts for the canonical dimer (e.g. monomeric assemblies)
    ca_prefilter: 12.0          # Å
    max_cell_shift: 1           # lattice translations -1..+1 in each direction
    canonical_match_jaccard: 0.5   # lattice interface counts as the canonical dimer at/above this Jaccard

local_fit:
  # Method-specific rules; categories are only combined AFTER these rules.
  xray:                         # per-residue RSCC (higher better) and RSRZ (lower better)
    strong:     {rscc_min: 0.90, rsrz_max: 2.0}
    acceptable: {rscc_min: 0.80, rsrz_max: 3.0}
  em:                           # per-residue Q-score relative to the value expected at the map resolution
    # expected Q = slope * resolution + intercept (Pintilie et al. 2020, Nat Methods 17:328)
    expected_q_slope: -0.1775
    expected_q_intercept: 1.1192
    strong_delta: 0.0           # Q >= expected + delta
    acceptable_delta: -0.15     # Q >= expected + delta
  scores: {strong local support: 3, acceptable local support: 2, weak local support: 1,
           unsupported or unavailable: 0}
  group_summary: median         # median | min : residue-group category uses this statistic

sanity:
  zn_ligand_distance_range: [1.8, 2.6]   # Å; Zn–N/O/S first-shell distances
  critical_checks:                       # a FAIL in any of these stops the full run
    - assembly_copies_vs_rcsb
    - sifts_segment_integrity
    - active_site_sequence_match
    - lid_calibration

validation_set:
  fixed_ids: [3BHX, 2XEG, 2OOT, 9S7U]   # lid calibration (closed, open), disordered-lid example, previous top template
  extra_ids: []                      # e.g. an entry with a disordered lid
  previous_workbook: null            # path to an earlier workbook (used to pick a disordered-lid entry)

pockets:                        # Milestone 3: ligand interaction fingerprints
  contact_max: 4.5              # Å, ligand–protein heavy-atom contact
  hbond_max: 3.5                # Å, ligand N/O – protein donor/acceptor (distance-only)
  ionic_max: 4.0                # Å, ligand O/N – basic/acidic protein atoms ("possible salt bridge")
  hydrophobic_max: 4.5          # Å, ligand C – hydrophobic side-chain C
  aromatic_centroid_max: 6.0    # Å, ring-centroid distance (π-stacking, possible)
  cation_pi_max: 6.0            # Å, cation (Lys NZ / Arg CZ / ligand N) – ring centroid
  metal_max: 2.8                # Å, ligand N/O/S – metal
  water_bridge_max: 3.5         # Å, water O to both a ligand and a protein polar atom
  weight_floor: 2.5             # Å, distance weight = 1 at or below this distance, 0 at contact_max
  clustering:
    hierarchical_method: average
    distance_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]   # 1 − Tanimoto; diagnostics reported for each
    chosen_threshold: 0.5
    dbscan_eps: 0.25            # chosen eps (written to LigandClusters); 0.4 merged 79/84 ligands into one cluster
    dbscan_eps_values: [0.2, 0.25, 0.3, 0.35, 0.4]   # diagnostics reported for each
    dbscan_min_samples: 3
  # Ligand-conditioned ranking (LigandConditionedRanking sheet). Leave null to skip
  # in the full run; the notebook can call rank_for_ligand() for any ligand afterwards.
  reference_ligand: null        # PDB component ID present in the analysed structures
  reference_smiles: null        # SMILES of a ligand not in the PDB (overrides the CCD SMILES)
  required_subpockets: []       # e.g. ["S1' glutamate pocket", "binuclear zinc region"]
  desired_lid_state: null       # open | closed | null
  ligand_conditioned:           # ligand-specific template ranking (weights; missing = worst)
    criteria:
      - {column: "Pocket-contact similarity",      direction: higher, weight: 3}
      - {column: "Ligand chemical similarity",     direction: higher, weight: 2}
      - {column: "Zinc-coordination similarity",   direction: higher, weight: 1}
      - {column: "Entrance-lid state match",       direction: higher, weight: 1}
      - {column: "Ligand local support score",     direction: higher, weight: 1}
      - {column: "Active-site completeness",       direction: higher, weight: 1}
      - {column: "Missing residues near pocket",   direction: lower,  weight: 1}
      - {column: "Conserved waters present",       direction: higher, weight: 0.5}
      - {column: "Resolution (Å)",                 direction: lower,  weight: 1}
      - {column: "Clashscore",                     direction: lower,  weight: 0.5}
    missing: worst

waters:                         # Milestone 3: conserved structural waters
  max_resolution: 2.2           # Å, eligible X-ray structures only
  max_clashscore: 10
  superpose_on: active_site     # active_site | core (all common CA)
  region_radius: 8.0            # Å, waters kept within this distance of Zn / catalytic-pocket / ligand atoms
                                # (catalytic pocket = literature residues + Zn ligands + sub-pockets)
  cluster_distance: 1.2         # Å, complete-linkage clustering of water oxygens (reference frame)
  hbond_max: 3.5                # Å, water – protein N/O partners
  zn_bridge_max: 2.5            # Å, water within this distance of both Zn = bridging water/hydroxide
  retain_min_fraction: 0.7      # retain if present in >= this fraction of eligible sites ...
  retain_min_partners: 2        # ... and H-bonded to >= this many protein atoms (or bound to Zn)

variants:                       # Milestone 3: sequence-variant mapping
  sources: [uniprot]            # add ebi_proteins to include gnomAD / ClinVar / COSMIC via the EBI Proteins API
  buried_rsa_max: 0.20          # relative SASA below this = buried
  exposed_rsa_min: 0.40
  high_variability_rmsf: 1.0    # Å, per-residue CA RMSF above this = high structural variability
  near_distance: 6.0            # Å, "near" active site / ligand / metal / interface

alphafold:                      # Milestone 4: AlphaFold DB + AlphaFold2 run in Colab (ColabFold)
  use_afdb: true                # fetch the current AlphaFold DB model for target.accession
  colabfold:                    # AlphaFold2 / AlphaFold2-multimer run inside Colab (colabfold_run.py)
    msa_mode: mmseqs2_uniref_env    # MSAs from the ColabFold MMseqs2 server
    model_type: auto                # auto = alphafold2_ptm (monomer) / alphafold2_multimer_v3 (complex)
    pair_mode: unpaired_paired
    num_models: 3                   # of 5 AF2 models; more = better ranking but longer (each ~15-40 min for the dimer on a T4)
    num_recycle: 6                  # null = ColabFold default (up to 20 for multimer, with early stop)
    num_seeds: 1
    templates: false                # PDB templates via the MMseqs2 server
    amber: false                    # relaxation needs OpenMM; structure preparation belongs to Milestone 5
    jobs:
      dimer:                        # full-length homodimer: TM helices + ectodomain, for the C2-constrained membrane fit
        enabled: true
        copies: 2
        start: 1
        end: null
      monomer:                      # full-length monomer (AlphaFold DB already provides one)
        enabled: false
        copies: 1
      ectodomain_dimer:             # 44-750 x 2: closer to the experimental constructs, no membrane anchor
        enabled: false
        copies: 2
        start: 44
  plddt_bands: [90, 70, 50]     # very high / confident / low / very low boundaries
  confident_plddt: 70           # "confident core" used for superposition and RMSD
  min_identity: 0.95            # model chain vs UniProt on aligned residues; below = WARNING
  min_identity_target: 0.50     # below this a chain is not treated as the target
  pae_diagonal_max: 1.5         # Å; median PAE diagonal above this = misindexed matrix (FAIL)
  compare:
    top_n: 5                    # experimental references = top N of TemplateRanking ...
    include_lid_calibration: true   # ... plus the entrance-lid calibration structures
    min_common_ca: 50
    gdt_cutoffs: [1, 2, 4, 8]   # Å
  dimer:                        # confident-dimer rule (all three must hold)
    iptm_confident: 0.8
    iptm_low: 0.6
    interface_pae_confident: 5.0    # Å, mean PAE over interface residue pairs
    interface_pae_low: 10.0
    canonical_jaccard_min: 0.5      # residue Jaccard to the experimental canonical interface
  ranking:
    modes:
      ectodomain_template:
        description: Ectodomain modelling template (confident and close to experiment)
        include: {}
        exclude: {}
        criteria:
          - {column: "Mean pLDDT ectodomain",          direction: higher, weight: 2}
          - {column: "Core CA RMSD to best template (Å)", direction: lower, weight: 2}
          - {column: "TM-score to best template",      direction: higher, weight: 1}
        missing: worst
      active_site:
        description: Active-site geometry (Zn ligands and literature residues)
        include: {}
        exclude: {}
        criteria:
          - {column: "Mean pLDDT active site",          direction: higher, weight: 1}
          - {column: "Zn-ligand side-chain RMSD (Å)",   direction: lower,  weight: 2}
          - {column: "Active-site side-chain RMSD (Å)", direction: lower,  weight: 1}
        missing: worst
      dimer:
        description: Dimer model (confident and canonical interface)
        include: {"Model kind": "multimer"}
        exclude: {}
        criteria:
          - {column: "ipTM",                           direction: higher, weight: 2}
          - {column: "Interface PAE (Å)",              direction: lower,  weight: 2}
          - {column: "Canonical interface Jaccard",    direction: higher, weight: 2}
        missing: worst
      membrane_anchor:
        description: Membrane-anchored starting model (confident TM helix, consistent placement)
        include: {}
        exclude: {"Orientation reliability": "unsupported", "Mean pLDDT TM": {max: 50}}   # TM helix pLDDT <= 50: not a usable anchor
        criteria:
          - {column: "Mean pLDDT TM",                  direction: higher, weight: 2}
          - {column: "TM helix tilt (°)",              direction: lower,  weight: 1}
          - {column: "TM in slab",                     direction: higher, weight: 1}
          - {column: "TM-ectodomain PAE (Å)",          direction: lower,  weight: 1}
          - {column: "Ectodomain atoms in slab",       direction: lower,  weight: 1}
          - {column: "Mean pLDDT ectodomain",          direction: higher, weight: 1}
        missing: worst
      membrane_dimer:
        description: Membrane-anchored dimer for MD (membrane_anchor + symmetry consistency)
        include: {"Model kind": "multimer"}
        exclude: {"Orientation reliability": "unsupported", "Mean pLDDT TM": {max: 50}}
        criteria:
          - {column: "Mean pLDDT TM",                  direction: higher, weight: 2}
          - {column: "TM helix tilt (°)",              direction: lower,  weight: 1}
          - {column: "C2 axis to membrane normal (°)", direction: lower,  weight: 2}
          - {column: "TM in slab",                     direction: higher, weight: 1}
          - {column: "Ectodomain atoms in slab",       direction: lower,  weight: 1}
          - {column: "ipTM",                           direction: higher, weight: 1}
        missing: worst

membrane:                       # membrane and construct context (checklist item 15)
  topology_source: consensus    # uniprot | deeptmhmm | consensus (agreeing residues; else UniProt)
  deeptmhmm:
    enabled: true               # needs the tmfold package and BioLib access; else NOT RUN
  ectodomain_core_start: 57     # first residue counted as ectodomain for clearance / PAE (after the stalk)
  c2_max_angle_deg: 20          # dimer C2 axis vs membrane normal; above = WARNING
  c2_constrained_placement: true    # dimers: refit the membrane with the normal fixed to the C2 axis
  tm_ecto_pae_reliable: 10.0    # Å; mean TM–ectodomain PAE above this = orientation not determined
  min_tm_in_slab: 0.8
  builder:                      # membrane-ready inputs (NOT MD-ready until Milestones 5–6)
    lipids: "POPC:CHL1"         # ASSUMPTION placeholder - choose a composition for your system
    ratio: "7:3"
    salt_molar: 0.15
    cation: "Na+"
    anion: "Cl-"
    water_margin_A: 17.5        # solvent above/below the protein
    lateral_margin_A: 15.0      # lipid margin around the protein
    force_field_note: "CHARMM36m / Lipid21 - choose in Milestone 6"

preparation:                    # Milestone 5: model preparation (notebook 04, model_preparation.py)
  template: 9S7U                # experimental ectodomain dimer used as the base (closed entrance lid; user choice)
  anchor_job: dimer             # Milestone 4 ColabFold job (cache/alphafold/colabfold/<job>) supplying the membrane anchor
  anchor_model: CF:dimer:rank_001   # AlphaFold2 model: cytoplasmic tail, TM helix, stalk, gaps and missing side chains
  name: hybrid_9S7U_AF2         # output folder name under outputs/model_preparation/
  fit_plddt_min: 70             # AlphaFold2 residues used for the global dimer superposition
  local_flank: 4                # residues on each side for the local fit of a gap segment
  junction_search: 12           # N-terminal graft point is searched over this many experimental residues
  junction_max_cn: 2.0          # Å; peptide C–N at a graft point outside junction_min_cn–junction_max_cn = WARNING
  junction_min_cn: 1.1          # Å; the graft point is chosen closest to the ideal 1.33 Å
  clash_heavy_min: 2.2          # Å; non-bonded heavy-atom pairs closer than this = clash (WARNING)
  keep_ions: [ZN, CA, CL]       # ions kept from the template
  keep_waters: zn_shell         # zn_shell (waters within water_zn_max of a Zn) | none | all
  water_zn_max: 3.0             # Å
  remove_ligands: true          # apo system: ligands / additives are removed and listed
  glycans:
    strategy: core_glcnac       # core_glcnac (first GlcNAc where observed experimentally) | none
    min_observed_structures: 1  # glycosylate a sequon only if observed in at least this many PDB entries
    donors_max: 10              # entries tried (TemplateRanking order) to transplant a missing core GlcNAc
    clash_min: 2.0              # Å; transplanted sugar heavy atom – protein heavy atom
    link_max: 2.0               # Å; sugar C1 – Asn ND2
  protonation:
    ph: 7.4
    window: 1.0                 # |pKa − pH| ≤ window → alternative microstate written
    always_alternative: [E424]  # catalytic acid/base: both states written regardless of PROPKA
    max_microstates: 12
    hbond_max: 3.2              # Å; His tautomer from H-bond acceptors near ND1 / NE2
  zn_md_treatment: bonded_mcpb  # user decision (2026-11-04): bonded model from MCPB.py, QM with PySCF in Colab
                                # (options: nonbonded_12_6_4 | bonded_mcpb | cationic_dummy)
  zn_bridge: hydroxide          # user decision: bridging OH- with Glu424 protonated (GLH), as in the GCPII
                                # QM/MM studies (Plechanovova et al. 2011, J Med Chem 54:7535) | water | null

md:                             # Milestone 6: system setup (notebook 05)
  protein_ff: ff14SB            # with Lipid21 + TIP3P + GLYCAM06j (the validated Amber membrane combination)
  water_model: tip3p
  mcpb:                         # bonded Zn model (MCPB.py + PySCF QM in Colab; zinc_params.py)
    group_name: PSMA
    site_chain: A               # one site parameterised; the identical chain B site reuses the templates
    cut_off: 2.5                # Å; metal–ligand bond detection. 2.5 gives the literature coordination for 9S7U:
                                # E425 bidentate (2.15/2.45) in; D453 OD1 (2.76) and a weak extra water (2.52) out
    ion_paraset: cm             # Li/Merz 12-6 CM set (TIP3P) for Zn van der Waals / MK radius
    gaff: 1
    large_opt: 0                # large model: single point for RESP (geometry from the prepared model)
    scale_factor: 0.9614        # B3LYP/6-31G* frequency scale factor (Scott & Radom 1996)
    force_constants: empirical  # USER DECISION (2026-11-12): MCPB.py -s 2e. Seminario (-s 2) gave k = 0–42 for five Zn bonds
                                # (Glu425 OE1 k = 0); Zn2–O then shortened 0.4 Å in the membrane minimisation
    bondfc_avg: 1
    anglefc_avg: 1
    qm_method: B3LYP/6-31G*     # MCPB.py default; run with PySCF (Gaussian B3LYP = b3lypg, UltraFine grid)
    qm_opt: hydrogens           # USER DECISION: optimise only H atoms; heavy atoms stay at the 9S7U positions, so the
                                # Zn–ligand r0 values are the experimental ones. A full gas-phase optimisation
                                # (qm_opt: full) shifted D453 to bidentate and E425 to monodentate (first Colab run).
  system:                       # part B: membrane system build (system_build.py)
    lipids: "POPC:CHL1"         # ASSUMPTION (user: proceed with the placeholder; compare with CHARMM-GUI later)
    ratio: "7:3"
    salt_cation: "Na+"
    salt_molar: 0.15
    dist: 15.0                  # Å, protein to box edge in x/y (packmol-memgen --dist)
    dist_wat: 17.5              # Å, water layer above/below the protein (--dist_wat)
    nloop: 20                   # packmol GENCAN loops per molecule type (packmol-memgen default)
    nloop_all: 30               # all-together loops (default 100 took hours for ~523k atoms); remaining overlaps
                                # are removed at the merge (whole molecules) and by minimisation
    movebadrandom: true         # re-place badly packed molecules randomly: faster convergence
    clash_cutoff: 2.0              # Å, environment heavy atom – protein heavy atom (whole molecule removed; was 1.6)
    clash_cutoff_h: 1.3            # Å, environment H – protein heavy atom (the protein's own H are added by tleap later)
    box_padding: 2.0               # Å added to packmol-memgen's box: molecules on opposite faces would touch through PBC
    lipid_ff: lipid21
    glycan_ff: GLYCAM_06j-1
  openmm:                       # minimisation and smoke test (OpenMM, Colab GPU)
    cutoff_nm: 1.0
    restraint_kcal: 10.0        # kcal/mol/Å² on protein heavy atoms in the restrained stages
    min_tolerance: 10.0         # kJ/mol/nm
    max_force_ok: 1000.0        # kJ/mol/nm; largest force after minimisation
    prerelax_max_force: 1.0e+7     # kJ/mol/nm; CPU pre-relaxation stops below this (safely under GPU overflow), then GPU
    prerelax_iterations: 100      # per CPU round (~5–10 min each for ~535k atoms on 2 CPU cores)
    prerelax_rounds: 5
    prerelax_needed_above: 1.0e+9  # CPU pre-relaxation only if the start forces could overflow the GPU
    hydroxide_h_sigma_nm: 0.1069   # LJ core for the zinc-bridging hydroxide H (GAFF ho has none): ff14SB amide-H values,
    hydroxide_h_epsilon_kj: 0.0657  # r* 0.6 A, eps 0.0157 kcal/mol; also applied to its 1-4 pairs (permanent, not minimisation-only)
    zn_r0_tolerance: 0.05      # Å; Zn bond-length correction stops when every minimised Zn–ligand distance is this close to the crystal
    zn_r0_rounds: 4            # USER DECISION (2026-11-12, option 1): r0 shifted to offset the site's electrostatic pull
    min_chunk_gpu: 2000             # minimiser iterations between checkpoints (GPU)
    min_chunk_cpu: 200              # ... on the CPU (~5–15 min per chunk for ~535k atoms)
    min_max_chunks_gpu: 25
    min_max_chunks_cpu: 60
    min_target_fraction: 0.5        # stop a stage when max force < 0.5 × max_force_ok, or E stops falling
    zn_bond_max_change: 0.3     # Å; Zn–ligand distance change allowed through minimisation / smoke run
    smoke_ps: [20, 20]          # restrained NVT heating to 310 K, then restrained NPT (membrane barostat); [] = skip
    temperature_k: 310
